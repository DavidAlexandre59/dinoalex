<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu du Dino</title>
    <style>
        body { margin: 0; padding: 0; background-color: #f7f7f7; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #game-container { position: relative; width: 100%; max-width: 600px; height: 200px; border-bottom: 2px solid #535353; overflow: hidden; background-color: #fff; }
        #dino { position: absolute; bottom: 0; left: 50px; width: 40px; height: 40px; background-color: #535353; }
        .jump { animation: jump 0.5s ease-out; }
        @keyframes jump { 0% { bottom: 0; } 50% { bottom: 80px; } 100% { bottom: 0; } }
        #obstacle { position: absolute; bottom: 0; right: -20px; width: 20px; height: 40px; background-color: #e64a19; }
        #score { position: absolute; top: 10px; right: 10px; font-size: 18px; font-weight: bold; color: #535353; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="dino"></div>
    <div id="obstacle"></div>
    <div id="score">Score: <span id="score-val">0</span></div>
</div>

<script>
    const dino = document.getElementById('dino');
    const obstacle = document.getElementById('obstacle');
    const scoreVal = document.getElementById('score-val');
    let isJumping = false;
    let score = 0;
    let gameSpeed = 2;

    function jump() {
        if (isJumping) return;
        isJumping = true;
        dino.classList.add('jump');
        setTimeout(() => {
            dino.classList.remove('jump');
            isJumping = false;
        }, 500);
    }

    document.addEventListener('keydown', (e) => { if (e.code === 'Space') jump(); });
    document.addEventListener('touchstart', jump);

    let obstacleX = 600;
    function gameLoop() {
        obstacleX -= gameSpeed;
        if (obstacleX < -20) {
            obstacleX = 600 + Math.random() * 200;
            score++;
            scoreVal.innerText = score;
            if (score % 5 === 0) gameSpeed += 0.5;
        }
        obstacle.style.left = obstacleX + 'px';

        const dinoRect = dino.getBoundingClientRect();
        const obsRect = obstacle.getBoundingClientRect();

        if (
            dinoRect.right > obsRect.left &&
            dinoRect.left < obsRect.right &&
            dinoRect.bottom > obsRect.top
        ) {
            alert('Game Over! Score: ' + score);
            score = 0;
            gameSpeed = 2;
            obstacleX = 600;
        }

        requestAnimationFrame(gameLoop);
    }
    gameLoop();
</script>

</body>
</html>
